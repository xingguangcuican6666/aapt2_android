name: Build aapt2 for Android aarch64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libprotobuf-dev \
            protobuf-compiler \
            libpng-dev \
            zlib1g-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Clone sdk-tools source (includes aapt2 with CMake support)
        run: |
          git clone --depth=1 https://github.com/Lzhiyong/sdk-tools.git
          cd sdk-tools
          git submodule update --init --recursive --depth=1

      - name: Build aapt2 for aarch64 using Android NDK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # android-26 = Android 8.0; matches Termux's minimum supported Android version
          cmake -B build-aarch64 -S sdk-tools \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build-aarch64 --target aapt2

      - name: Build termux-elf-cleaner
        run: |
          git clone --depth=1 https://github.com/termux/termux-elf-cleaner.git \
            /tmp/termux-elf-cleaner
          cmake -B /tmp/termux-elf-cleaner/build \
            -S /tmp/termux-elf-cleaner \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/termux-elf-cleaner/build
          sudo cp /tmp/termux-elf-cleaner/build/termux-elf-cleaner /usr/local/bin/

      - name: Apply termux-elf-cleaner and package binary
        run: |
          cp build-aarch64/aapt2 ./aapt2-aarch64
          termux-elf-cleaner ./aapt2-aarch64
          echo "Binary info:"
          file ./aapt2-aarch64
          ls -la ./aapt2-aarch64

      - name: Upload aapt2 binary
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-aarch64-android
          path: aapt2-aarch64
          if-no-files-found: error
