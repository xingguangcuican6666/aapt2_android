name: Build aapt2 for Android aarch64 (AOSP via repo)

# This workflow uses Google's `repo` tool to pull aapt2 and its
# dependencies directly from official AOSP repositories on
# android.googlesource.com, then cross-compiles with the Android NDK.
#
# Source manifest: manifests/aosp-aapt2.xml
# CMake build:     cmake/CMakeLists.txt
#
# Trigger manually via workflow_dispatch, or automatically on push/PR
# to main/master (same as the existing sdk-tools workflow).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── repo tool ──────────────────────────────────────────────────────────
      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      # ── Android NDK ────────────────────────────────────────────────────────
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      # ── Build dependencies (host tools only) ───────────────────────────────
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3

      # ── protoc (host) ──────────────────────────────────────────────────────
      # AOSP android-14 uses protobuf 3.21.x.  Install a matching prebuilt
      # protoc so generated .pb.cc/.pb.h files are ABI-compatible with the
      # libprotobuf runtime we compile from AOSP external/protobuf.
      - name: Install protoc 3.21.x (matches AOSP android-14 protobuf)
        run: |
          PROTOC_VER=3.21.12
          curl -fsSL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip" \
            -o /tmp/protoc.zip
          sudo unzip -q /tmp/protoc.zip -d /usr/local
          protoc --version

      # ── repo init ─────────────────────────────────────────────────────────
      # repo requires a git repository that holds the manifest XML.
      # We package our manifests/ directory into a temporary bare git repo
      # so repo init can be pointed at it with -u <local-path>.
      - name: Create manifest git repository
        run: |
          MANIFEST_GIT=/tmp/aosp-manifest.git
          git init "$MANIFEST_GIT"
          git -C "$MANIFEST_GIT" config user.email "ci@github.com"
          git -C "$MANIFEST_GIT" config user.name "GitHub CI"
          cp "$GITHUB_WORKSPACE/manifests/aosp-aapt2.xml" \
             "$MANIFEST_GIT/default.xml"
          git -C "$MANIFEST_GIT" add default.xml
          git -C "$MANIFEST_GIT" commit -m "aosp-aapt2 manifest"

      - name: Initialize repo workspace
        run: |
          mkdir -p aosp
          cd aosp
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          # --partial-clone --clone-filter=blob:none: blobless clones —
          #   tree/commit objects are fetched up front; file blobs are
          #   fetched on demand, so sparse-checkout dramatically reduces
          #   the download for large repos like frameworks/base.
          repo init \
            -u /tmp/aosp-manifest.git \
            --partial-clone \
            --clone-filter=blob:none \
            --no-clone-bundle \
            --no-tags \
            --depth=1

      # ── Sync small AOSP projects via repo ─────────────────────────────────
      # frameworks/base and system/core are large multi-GB repositories; we
      # handle them separately below with sparse checkout to fetch only the
      # paths actually needed.  All other projects in the manifest are small
      # enough to sync in full.
      - name: Sync small AOSP projects via repo
        run: |
          cd aosp
          repo sync -c --no-tags --no-clone-bundle -j4 \
            platform/system/libbase \
            platform/system/logging \
            platform/external/protobuf \
            platform/external/libpng \
            platform/external/expat \
            platform/external/zlib

      # ── Sparse-clone large AOSP projects ──────────────────────────────────
      # frameworks/base: only tools/aapt2/, libs/androidfw/, and the
      #   framework proto files that aapt2 .proto files import.
      # system/core: only libcutils/, libutils/, libziparchive/.
      - name: Sparse-clone frameworks/base (aapt2 + androidfw only)
        run: |
          cd aosp
          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            --branch android-14.0.0_r1 \
            https://android.googlesource.com/platform/frameworks/base \
            frameworks/base
          git -C frameworks/base sparse-checkout init --cone
          git -C frameworks/base sparse-checkout set \
            tools/aapt2 \
            libs/androidfw \
            core/proto
          git -C frameworks/base checkout

      - name: Sparse-clone system/core (libcutils + libutils + libziparchive)
        run: |
          cd aosp
          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            --branch android-14.0.0_r1 \
            https://android.googlesource.com/platform/system/core \
            system/core
          git -C system/core sparse-checkout init --cone
          git -C system/core sparse-checkout set \
            libcutils \
            libutils \
            libziparchive
          git -C system/core checkout

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build aapt2 for aarch64 using Android NDK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # android-26 = Android 8.0 — matches Termux minimum supported API
          cmake -B build-aarch64 -S "$GITHUB_WORKSPACE/cmake" \
            -DAOSP_ROOT="$GITHUB_WORKSPACE/aosp" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build-aarch64 --target aapt2

      # ── termux-elf-cleaner ─────────────────────────────────────────────────
      - name: Build termux-elf-cleaner
        run: |
          git clone --depth=1 \
            https://github.com/termux/termux-elf-cleaner.git \
            /tmp/termux-elf-cleaner
          cmake -B /tmp/termux-elf-cleaner/build \
            -S /tmp/termux-elf-cleaner \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/termux-elf-cleaner/build
          sudo cp /tmp/termux-elf-cleaner/build/termux-elf-cleaner \
            /usr/local/bin/

      # ── Package ───────────────────────────────────────────────────────────
      - name: Apply termux-elf-cleaner and package binary
        run: |
          cp build-aarch64/aapt2 ./aapt2-aarch64
          termux-elf-cleaner ./aapt2-aarch64
          echo "Binary info:"
          file ./aapt2-aarch64
          ls -la ./aapt2-aarch64

      - name: Upload aapt2 binary
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-aarch64-android-aosp
          path: aapt2-aarch64
          if-no-files-found: error
